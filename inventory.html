<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Medicine Inventory</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* Flashing LOW STOCK badge */
@keyframes flash { 0%,50%,100%{opacity:1} 25%,75%{opacity:0} }
.low-stock-badge { animation: flash 1s infinite; font-weight:bold; }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  addDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyDkuo0jjGYIBC1MKOWD42XvcB4nWy_72qQ",
  authDomain: "medicine-inventory-cc500.firebaseapp.com",
  projectId: "medicine-inventory-cc500",
  storageBucket: "medicine-inventory-cc500.firebasestorage.app",
  messagingSenderId: "1044916941588",
  appId: "1:1044916941588:web:ef2a8ee26f23b24d07c801",
  measurementId: "G-BB4NQX65NN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* Load table */
async function loadTable(collectionName, tableId){
  const snapshot = await getDocs(collection(db,collectionName));
  const table = document.getElementById(tableId);
  table.innerHTML="";
  snapshot.forEach(docSnap=>{
    const data=docSnap.data();
    const row=document.createElement("tr");
    const lowStockBadge = data.qty<10?'<span class="badge bg-danger low-stock-badge">LOW STOCK</span>':'';
    row.innerHTML=`
      <td><input type="text" class="form-control" value="${data.name}" id="name-${docSnap.id}"></td>
      <td><input type="text" class="form-control" value="${data.mg}" id="mg-${docSnap.id}"></td>
      <td><input type="number" class="form-control" step="0.01" value="${data.price}" id="price-${docSnap.id}"></td>
      <td>
        <input type="number" class="form-control" value="${data.qty}" id="qty-${docSnap.id}" style="${data.qty<10?'color:red;font-weight:bold;':''}">
        ${lowStockBadge}
      </td>
      <td>
        <button class="btn btn-success btn-sm w-100 mb-1" onclick="updateMedicine('${collectionName}','${docSnap.id}')">Save</button>
        <button class="btn btn-danger btn-sm w-100" onclick="deleteMedicine('${collectionName}','${docSnap.id}')">Delete</button>
      </td>
    `;
    table.appendChild(row);
  });
}

/* Update medicine */
window.updateMedicine = async function(collectionName,id){
  const name=document.getElementById(`name-${id}`).value;
  const mg=document.getElementById(`mg-${id}`).value;
  const price=parseFloat(document.getElementById(`price-${id}`).value);
  const qty=parseInt(document.getElementById(`qty-${id}`).value);
  if(qty<0){alert("Quantity cannot be negative!"); return;}
  const ref=doc(db,collectionName,id);
  await updateDoc(ref,{name,mg,price,qty});
  alert("Medicine Updated!");
  loadTable(collectionName,collectionName==="adult_medicine"?"adultTable":"pediaTable");
}

/* Delete medicine */
window.deleteMedicine = async function(collectionName,id){
  if(!confirm("Are you sure you want to delete this medicine?")) return;
  const ref=doc(db,collectionName,id);
  await deleteDoc(ref);
  loadTable(collectionName,collectionName==="adult_medicine"?"adultTable":"pediaTable");
}

/* Add new medicine */
window.addMedicine = async function(collectionName){
  const name=document.getElementById(`newName-${collectionName}`).value;
  const mg=document.getElementById(`newMg-${collectionName}`).value;
  const price=parseFloat(document.getElementById(`newPrice-${collectionName}`).value);
  const qty=parseInt(document.getElementById(`newQty-${collectionName}`).value);
  if(!name || !mg || isNaN(price) || isNaN(qty)){alert("Fill all fields!"); return;}
  await addDoc(collection(db,collectionName),{name,mg,price,qty});
  alert("Medicine Added!");
  document.getElementById(`newName-${collectionName}`).value="";
  document.getElementById(`newMg-${collectionName}`).value="";
  document.getElementById(`newPrice-${collectionName}`).value="";
  document.getElementById(`newQty-${collectionName}`).value="";
  loadTable(collectionName,collectionName==="adult_medicine"?"adultTable":"pediaTable");
}

/* Initial load */
loadTable("adult_medicine","adultTable");
loadTable("pedia_medicine","pediaTable");

</script>
</head>

<body class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1>Medicine Inventory Management</h1>
  <a href="index.html" class="btn btn-secondary">Back to Patient Page</a>
</div>

<!-- Adult Medicine -->
<h2>Adult Medicines</h2>
<div class="card p-3 mb-3">
  <div class="row g-2 mb-2">
    <div class="col-md-3"><input type="text" class="form-control" id="newName-adult_medicine" placeholder="Name"></div>
    <div class="col-md-2"><input type="text" class="form-control" id="newMg-adult_medicine" placeholder="Mg"></div>
    <div class="col-md-2"><input type="number" class="form-control" id="newPrice-adult_medicine" placeholder="Price" step="0.01"></div>
    <div class="col-md-2"><input type="number" class="form-control" id="newQty-adult_medicine" placeholder="Qty"></div>
    <div class="col-md-3"><button class="btn btn-primary w-100" onclick="addMedicine('adult_medicine')">Add Medicine</button></div>
  </div>
  <div class="table-responsive">
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr><th>Name</th><th>Dosage (mg)</th><th>Price</th><th>Quantity</th><th>Action</th></tr>
      </thead>
      <tbody id="adultTable"></tbody>
    </table>
  </div>
</div>

<!-- Pedia Medicine -->
<h2>Pedia Medicines</h2>
<div class="card p-3 mb-3">
  <div class="row g-2 mb-2">
    <div class="col-md-3"><input type="text" class="form-control" id="newName-pedia_medicine" placeholder="Name"></div>
    <div class="col-md-2"><input type="text" class="form-control" id="newMg-pedia_medicine" placeholder="Mg/ml"></div>
    <div class="col-md-2"><input type="number" class="form-control" id="newPrice-pedia_medicine" placeholder="Price" step="0.01"></div>
    <div class="col-md-2"><input type="number" class="form-control" id="newQty-pedia_medicine" placeholder="Qty"></div>
    <div class="col-md-3"><button class="btn btn-primary w-100" onclick="addMedicine('pedia_medicine')">Add Medicine</button></div>
  </div>
  <div class="table-responsive">
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr><th>Name</th><th>Dosage (mg/ml)</th><th>Price</th><th>Quantity</th><th>Action</th></tr>
      </thead>
      <tbody id="pediaTable"></tbody>
    </table>
  </div>
</div>
</body>
</html>
