<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Medical Mission System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Medical Mission System</h2>
  <a href="inventory.html" class="btn btn-success">View Inventory</a>
</div>

<!-- ================= DASHBOARD SUMMARY ================= -->
<div class="card p-3 mb-4">
  <h5>Dashboard Summary (Total Patients per Barangay)</h5>
  <ul id="summaryList" class="list-group"></ul>
</div>

<!-- ================= PATIENT FORM ================= -->
<div class="card p-3 mb-4">

  <div class="row g-3 mb-2">

      <label>Date:</label>
      <input type="date" class="form-control" id="date">
    </div>

    <div class="col-md-3">
      <label>Name:</label>
      <input type="text" class="form-control" id="patientName">
    </div>

    <div class="col-md-3">
      <label>Barangay:</label>
      <select class="form-select" id="barangaySelect">
        <option value="">Select Barangay</option>
        <option>Aduas Centro</option>
        <option>Aduas Norte</option>
        <option>Aduas Sur</option>
        <option>Barrera</option>
        <option>Cantarilla</option>
        <option>Cruz Roja</option>
        <option>Daan Sarile</option>
        <option>Dimasalang</option>
        <option>D.S. Garcia</option>
        <option>Gen. Luna</option>
        <option>Imelda</option>
        <option>Isla</option>
        <option>M.S. Garcia</option>
        <option>Nabao</option>
        <option>Obrero</option>
        <option>Pagas</option>
        <option>Pag-Asa</option>
        <option>San Juan Acffa</option>
        <option>San Roque Norte</option>
        <option>San Roque Sur</option>
        <option>Sanbermicristi</option>
        <option>Sumacab Este</option>
        <option>Valdefuente</option>
      </select>
    </div>

    <div class="col-md-2">
      <label>Block Leader:</label>
      <input type="text" class="form-control" id="blockLeader">
    </div>
  </div>

  <div class="row g-3 mb-2">
    <div class="col-md-6">
      <label>Problem:</label>
      <input type="text" class="form-control" id="problem">
    </div>

    <div class="col-md-3">
      <label>Type:</label>
      <select class="form-select" id="medicineType">
        <option value="">Select Type</option>
        <option>Adult</option>
        <option>Pedia</option>
      </select>
    </div>
  </div>

  <div class="text-end">
    <button class="btn btn-primary me-2" id="saveBtn">Save</button>
    <button class="btn btn-secondary" id="cancelEditBtn" style="display:none;">Cancel Edit</button>
  </div>
</div>

<!-- ================= FILTER ================= -->
<div class="mb-2">
  <label>Filter by Barangay:</label>
  <select class="form-select w-25" id="filterBarangay">
    <option value="">All Barangays</option>
    <option>Aduas Centro</option>
    <option>Aduas Norte</option>
    <option>Aduas Sur</option>
    <option>Barrera</option>
    <option>Cantarilla</option>
    <option>Cruz Roja</option>
    <option>Daan Sarile</option>
    <option>Dimasalang</option>
    <option>D.S. Garcia</option>
    <option>Gen. Luna</option>
    <option>Imelda</option>
    <option>Isla</option>
    <option>M.S. Garcia</option>
    <option>Nabao</option>
    <option>Obrero</option>
    <option>Pagas</option>
    <option>Pag-Asa</option>
    <option>San Juan Acffa</option>
    <option>San Roque Norte</option>
    <option>San Roque Sur</option>
    <option>Sanbermicristi</option>
    <option>Sumacab Este</option>
    <option>Valdefuente</option>
  </select>

  <button class="btn btn-warning mt-2" id="exportBtn">Export Filtered</button>
</div>

<!-- ================= HISTORY TABLE ================= -->
<div class="table-responsive">
<table class="table table-bordered table-striped">
<thead class="table-dark">
<tr>
<th>Date</th>
<th>Name</th>
<th>Barangay</th>
<th>Problem</th>
<th>Block Leader</th>
<th>Type</th>
<th>Total</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="history"></tbody>
</table>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import * as XLSX from "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm";

/* ===== FIREBASE CONFIG ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDkuo0jjGYIBC1MKOWD42XvcB4nWy_72qQ",
  authDomain: "medicine-inventory-cc500.firebaseapp.com",
  projectId: "medicine-inventory-cc500",
  storageBucket: "medicine-inventory-cc500.firebasestorage.app",
  messagingSenderId: "1044916941588",
  appId: "1:1044916941588:web:ef2a8ee26f23b24d07c801",
  measurementId: "G-BB4NQ65NN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const historyTable = document.getElementById("history");
const summaryList = document.getElementById("summaryList");
const filterBarangay = document.getElementById("filterBarangay");

/* ================= LOAD HISTORY ================= */
async function loadHistory() {
  const filterValue = filterBarangay.value.trim();
  const snapshot = await getDocs(collection(db, "medical_records"));
  historyTable.innerHTML = "";

  snapshot.forEach(docSnap => {
    const d = docSnap.data();
    if (filterValue && d.barangay !== filterValue) return;

    historyTable.innerHTML += `
      <tr>
        <td>${d.date}</td>
        <td>${d.patientName}</td>
        <td>${d.barangay}</td>
        <td>${d.problem}</td>
        <td>${d.blockLeader}</td>
        <td>${d.medicineType}</td>
        <td>${d.total}</td>
        <td>
          <button class="btn btn-sm btn-warning editBtn" data-id="${docSnap.id}">Edit</button>
          <button class="btn btn-sm btn-danger deleteBtn" data-id="${docSnap.id}">Delete</button>
        </td>
      </tr>
    `;
  });

  attachActions();
  loadSummary();
}

/* ================= DASHBOARD SUMMARY ================= */
async function loadSummary() {
  const snapshot = await getDocs(collection(db,"medical_records"));
  const counts = {};
  snapshot.forEach(docSnap=>{
    const b = docSnap.data().barangay;
    counts[b] = (counts[b] || 0) + 1;
  });

  summaryList.innerHTML="";
  for(const barangay in counts){
    summaryList.innerHTML += `
      <li class="list-group-item d-flex justify-content-between">
        ${barangay}
        <span class="badge bg-primary">${counts[barangay]}</span>
      </li>
    `;
  }
}

/* ================= DELETE WITH STOCK RETURN ================= */
async function deleteRecord(id){
  if(!confirm("Are you sure you want to delete this record?")) return;

  const recordRef = doc(db,"medical_records",id);
  const recordSnap = await getDoc(recordRef);
  const recordData = recordSnap.data();

  if(recordData.medicines){
    for(const med of recordData.medicines){
      const collectionName = recordData.medicineType === "Adult" ? "adult_medicine" : "pedia_medicine";
      const medRef = doc(db,collectionName,med.id);
      const medSnap = await getDoc(medRef);
      if(medSnap.exists()){
        const currentQty = medSnap.data().qty;
        await updateDoc(medRef,{ qty: currentQty + med.quantity });
      }
    }
  }

  await deleteDoc(recordRef);
  alert("Deleted & stock returned!");
  loadHistory();
}

/* ================= EXPORT FILTERED ================= */
document.getElementById("exportBtn").onclick = async ()=>{
  const filterValue = filterBarangay.value.trim();
  const snapshot = await getDocs(collection(db,"medical_records"));
  const data = [];

  snapshot.forEach(docSnap=>{
    const d=docSnap.data();
    if(filterValue && d.barangay !== filterValue) return;
    data.push(d);
  });

  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Records");
  XLSX.writeFile(wb,"Filtered_Medical_Report.xlsx");
};

function attachActions(){
  document.querySelectorAll(".deleteBtn").forEach(btn=>{
    btn.onclick=()=>deleteRecord(btn.dataset.id);
  });
}

filterBarangay.addEventListener("change",loadHistory);

loadHistory();

</script>
</body>
</html>
