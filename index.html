<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Medical Mission System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import * as XLSX from "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm";

/* Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyDkuo0jjGYIBC1MKOWD42XvcB4nWy_72qQ",
  authDomain: "medicine-inventory-cc500.firebaseapp.com",
  projectId: "medicine-inventory-cc500",
  storageBucket: "medicine-inventory-cc500.firebasestorage.app",
  messagingSenderId: "1044916941588",
  appId: "1:1044916941588:web:ef2a8ee26f23b24d07c801",
  measurementId: "G-BB4NQX65NN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentCollection = "";

// Medicine Type select
document.getElementById("medicineType")?.addEventListener("change", (e)=>{
  const type = e.target.value;
  if(!type) return;
  currentCollection = type==="Adult"?"adult_medicine":"pedia_medicine";
  document.getElementById("medicineSearch").value="";
  document.getElementById("medicineResults").innerHTML="";
});

// Search medicine
window.searchMedicine = async function() {
  const queryText = document.getElementById("medicineSearch").value.toLowerCase();
  const resultsDiv = document.getElementById("medicineResults");
  resultsDiv.innerHTML = "";
  if(!queryText || !currentCollection) return;

  const snapshot = await getDocs(collection(db,currentCollection));
  snapshot.forEach(docSnap=>{
    const data = docSnap.data();
    if(data.name.toLowerCase().includes(queryText)){
      const item = document.createElement("a");
      item.href="#";
      item.className="list-group-item list-group-item-action";
      item.textContent=`${data.name} - ${data.mg} (Stock: ${data.qty})`;
      item.onclick=()=>selectMedicine(docSnap.id,data);
      resultsDiv.appendChild(item);
    }
  });
};

// Select medicine
function selectMedicine(id,data){
  const search = document.getElementById("medicineSearch");
  search.value=data.name;
  search.dataset.id=id;
  document.getElementById("price").value=data.price;
  document.getElementById("quantity").value=1;
  computeTotal();
  document.getElementById("medicineResults").innerHTML="";
}

// Compute total
window.computeTotal=function(){
  const qty=parseFloat(document.getElementById("quantity").value)||0;
  const price=parseFloat(document.getElementById("price").value)||0;
  document.getElementById("amount").value=(qty*price).toFixed(2);
};

// Toggle barangay textbox
window.toggleBarangayTextbox = function(){
  const select=document.getElementById("barangaySelect");
  const textbox=document.getElementById("barangayTextbox");
  if(select.value==="Other"){
    textbox.style.display="block";
  } else{
    textbox.style.display="none";
    textbox.value="";
  }
};

// Add patient record
window.addRecord=async function(){
  const patientName=document.getElementById("patientName").value.trim();
  const date=document.getElementById("date").value;
  const selectedBarangay=document.getElementById("barangaySelect").value;
  const barangay = selectedBarangay==="Other"?document.getElementById("barangayTextbox").value.trim():selectedBarangay;
  const problem = document.getElementById("problem").value.trim();
  const blockLeader = document.getElementById("blockLeader").value.trim();
  const medId=document.getElementById("medicineSearch").dataset.id;
  const qty=parseInt(document.getElementById("quantity").value);
  const price=parseFloat(document.getElementById("price").value);
  const total=parseFloat(document.getElementById("amount").value);
  const medType=document.getElementById("medicineType").value;

  if(!patientName || !date || !barangay || !problem || !blockLeader || !medId || !medType){
    alert("Please fill all required fields!"); 
    return;
  }

  // Check stock
  const medRef = doc(db, currentCollection, medId);
  const medSnap = await getDoc(medRef);
  const medData = medSnap.data();
  if(!medData){
    alert("Medicine not found!");
    return;
  }
  if(qty > medData.qty || qty <= 0){
    alert("Invalid quantity!");
    return;
  }

  // Deduct stock
  await updateDoc(medRef, { qty: medData.qty - qty });

  // Save record
  await addDoc(collection(db,"medical_records"),{
    patientName,
    date,
    barangay,
    problem,
    blockLeader,
    medicineType:medType,
    medicine:medData.name,
    mg:medData.mg,
    quantity:qty,
    price_at_time:price,
    total
  });

  alert("Record Saved!");
  loadHistory();

  // Reset form
  document.getElementById("patientName").value="";
  document.getElementById("date").value="";
  document.getElementById("barangaySelect").value="";
  toggleBarangayTextbox();
  document.getElementById("problem").value="";
  document.getElementById("blockLeader").value="";
  document.getElementById("medicineType").value="";
  document.getElementById("medicineSearch").value="";
  document.getElementById("price").value="";
  document.getElementById("quantity").value="";
  document.getElementById("amount").value="";
  document.getElementById("medicineSearch").dataset.id="";
};

// Load patient history
async function loadHistory(){
  const snapshot = await getDocs(collection(db,"medical_records"));
  const table = document.getElementById("history");
  table.innerHTML = "";
  snapshot.forEach(docSnap=>{
    const d = docSnap.data();
    table.innerHTML+=`
      <tr>
        <td>${d.date}</td>
        <td>${d.patientName}</td>
        <td>${d.barangay}</td>
        <td>${d.problem}</td>
        <td>${d.blockLeader}</td>
        <td>${d.medicineType}</td>
        <td>${d.medicine}</td>
        <td>${d.quantity}</td>
        <td>${d.total}</td>
      </tr>`;
  });
}
window.loadHistory=loadHistory;
loadHistory();

// Excel export
window.exportExcel=async function(){
  const snapshot = await getDocs(collection(db,"medical_records"));
  const data=[];
  snapshot.forEach(docSnap=>data.push(docSnap.data()));
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Records");
  XLSX.writeFile(wb,"Medical_Report.xlsx");
};
</script>
</head>

<body class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Medical Mission System</h2>
  <a href="inventory.html" class="btn btn-success">View Inventory</a>
</div>

<!-- Patient Form -->
<div class="card p-3 mb-4">
  <div class="row g-2">
    <div class="col-md-3"><input type="text" class="form-control" id="patientName" placeholder="Patient Name"></div>
    <div class="col-md-2"><input type="date" class="form-control" id="date"></div>
    <div class="col-md-2">
      <select class="form-select" id="barangaySelect" onchange="toggleBarangayTextbox()">
        <option value="">Select Barangay</option>
        <option value="Aduas Centro">Aduas Centro</option>
        <option value="Aduas Norte">Aduas Norte</option>
        <option value="Aduas Sur">Aduas Sur</option>
        <option value="Barrera">Barrera</option>
        <option value="Cantarilla">Cantarilla</option>
        <option value="Cruz Roja">Cruz Roja</option>
        <option value="Daan Sarile">Daan Sarile</option>
        <option value="Dimasalang">Dimasalang</option>
        <option value="D.S. Garcia">D.S. Garcia</option>
        <option value="Gen. Luna">Gen. Luna</option>
        <option value="Imelda">Imelda</option>
        <option value="Isla">Isla</option>
        <option value="M.S. Garcia">M.S. Garcia</option>
        <option value="Nabao">Nabao</option>
        <option value="Obrero">Obrero</option>
        <option value="Pagas">Pagas</option>
        <option value="Pag-Asa">Pag-Asa</option>
        <option value="San Juan Acffa">San Juan Acffa</option>
        <option value="San Roque Norte">San Roque Norte</option>
        <option value="San Roque Sur">San Roque Sur</option>
        <option value="Sanbermicristi">Sanbermicristi</option>
        <option value="Sumacab Este">Sumacab Este</option>
        <option value="Valdefuente">Valdefuente</option>
        <option value="Other">Other</option>
      </select>
      <input type="text" class="form-control mt-1" id="barangayTextbox" placeholder="Enter Barangay" style="display:none;">
    </div>
    <div class="col-md-2"><input type="text" class="form-control" id="problem" placeholder="Problem Presented"></div>
    <div class="col-md-2"><input type="text" class="form-control" id="blockLeader" placeholder="Block Leader"></div>
    <div class="col-md-2">
      <select class="form-select" id="medicineType">
        <option value="">Select Type</option>
        <option>Adult</option>
        <option>Pedia</option>
      </select>
    </div>
    <div class="col-md-3">
      <input type="text" class="form-control" id="medicineSearch" placeholder="Search medicine..." oninput="searchMedicine()">
      <div id="medicineResults" class="list-group position-absolute w-100" style="z-index:10;"></div>
    </div>
  </div>
  <div class="row g-2 mt-2">
    <div class="col-md-1"><input type="number" class="form-control" id="quantity" placeholder="Qty" oninput="computeTotal()"></div>
    <div class="col-md-2"><input type="number" class="form-control" id="price" placeholder="Price" step="0.01" oninput="computeTotal()"></div>
    <div class="col-md-2"><input type="number" class="form-control" id="amount" placeholder="Total" step="0.01" readonly></div>
    <div class="col-md-2"><button class="btn btn-primary w-100" onclick="addRecord()">Save</button></div>
  </div>
</div>

<!-- Patient History Table -->
<div class="table-responsive">
  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>Date</th>
        <th>Name</th>
        <th>Barangay</th>
        <th>Problem</th>
        <th>Block Leader</th>
        <th>Type</th>
        <th>Medicine</th>
        <th>Qty</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="history"></tbody>
  </table>
</div>

<div class="mb-4">
  <button class="btn btn-warning" onclick="exportExcel()">Export Excel</button>
</div>
</body>
</html>
