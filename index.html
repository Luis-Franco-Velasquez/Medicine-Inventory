<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Medical Mission System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container py-4">

<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Medical Mission System</h2>
  <a href="inventory.html" class="btn btn-success">View Inventory</a>
</div>

<!-- ================= PATIENT FORM ================= -->
<div class="card p-3 mb-4">

  <div class="row g-3 mb-2">
    <div class="col-md-2">
      <label>Date:</label>
      <input type="date" class="form-control" id="date">
    </div>

    <div class="col-md-3">
      <label>Name:</label>
      <input type="text" class="form-control" id="patientName">
    </div>

    <div class="col-md-3">
      <label>Barangay:</label>
      <select class="form-select" id="barangaySelect">
        <option value="">Select Barangay</option>
        <option>Aduas Centro</option>
        <option>Aduas Norte</option>
        <option>Aduas Sur</option>
        <option>Barrera</option>
        <option>Cantarilla</option>
        <option>Cruz Roja</option>
        <option>Daan Sarile</option>
        <option>Dimasalang</option>
        <option>D.S. Garcia</option>
        <option>Gen. Luna</option>
        <option>Imelda</option>
        <option>Isla</option>
        <option>M.S. Garcia</option>
        <option>Nabao</option>
        <option>Obrero</option>
        <option>Pagas</option>
        <option>Pag-Asa</option>
        <option>San Juan Acffa</option>
        <option>San Roque Norte</option>
        <option>San Roque Sur</option>
        <option>Sanbermicristi</option>
        <option>Sumacab Este</option>
        <option>Valdefuente</option>
        <option>Other</option>
      </select>
      <input type="text" class="form-control mt-1" id="barangayTextbox" placeholder="Enter Barangay" style="display:none;">
    </div>

    <div class="col-md-2">
      <label>Block Leader:</label>
      <input type="text" class="form-control" id="blockLeader">
    </div>
  </div>

  <div class="row g-3 mb-2">
    <div class="col-md-6">
      <label>Problem:</label>
      <input type="text" class="form-control" id="problem">
    </div>

    <div class="col-md-3">
      <label>Type:</label>
      <select class="form-select" id="medicineType">
        <option value="">Select Type</option>
        <option>Adult</option>
        <option>Pedia</option>
      </select>
    </div>

    <div class="col-md-3 position-relative">
      <label>Search Medicine:</label>
      <input type="text" class="form-control" id="medicineSearch">
      <div id="medicineResults" class="list-group position-absolute w-100" style="z-index:10;"></div>

      <div id="selectedMedicines" class="mt-2"></div>

      <div class="mt-1 text-end">
        <strong>Total: ₱ <span id="grandTotal">0.00</span></strong>
      </div>
    </div>
  </div>

  <div class="text-end">
    <button class="btn btn-primary me-2" id="saveBtn">Save</button>
    <button class="btn btn-warning" id="exportBtn">Export Excel</button>
  </div>

</div>

<!-- ================= FILTER ================= -->
<div class="mb-2">
  <label>Filter by Barangay:</label>
  <select class="form-select w-25" id="filterBarangay">
    <option value="">All Barangays</option>
    <option>Aduas Centro</option>
    <option>Aduas Norte</option>
    <option>Aduas Sur</option>
    <option>Barrera</option>
    <option>Cantarilla</option>
    <option>Cruz Roja</option>
    <option>Daan Sarile</option>
    <option>Dimasalang</option>
    <option>D.S. Garcia</option>
    <option>Gen. Luna</option>
    <option>Imelda</option>
    <option>Isla</option>
    <option>M.S. Garcia</option>
    <option>Nabao</option>
    <option>Obrero</option>
    <option>Pagas</option>
    <option>Pag-Asa</option>
    <option>San Juan Acffa</option>
    <option>San Roque Norte</option>
    <option>San Roque Sur</option>
    <option>Sanbermicristi</option>
    <option>Sumacab Este</option>
    <option>Valdefuente</option>
  </select>
</div>

<!-- ================= HISTORY TABLE ================= -->
<div class="table-responsive">
<table class="table table-bordered table-striped">
<thead class="table-dark">
<tr>
<th>Date</th>
<th>Name</th>
<th>Barangay</th>
<th>Problem</th>
<th>Block Leader</th>
<th>Type</th>
<th>Medicines</th>
<th>Total</th>
</tr>
</thead>
<tbody id="history"></tbody>
</table>
</div>

<!-- ================= SCRIPT ================= -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import * as XLSX from "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm";

const firebaseConfig = {
  apiKey: "AIzaSyDkuo0jjGYIBC1MKOWD42XvcB4nWy_72qQ",
  authDomain: "medicine-inventory-cc500.firebaseapp.com",
  projectId: "medicine-inventory-cc500",
  storageBucket: "medicine-inventory-cc500.firebasestorage.app",
  messagingSenderId: "1044916941588",
  appId: "1:1044916941588:web:ef2a8ee26f23b24d07c801",
  measurementId: "G-BB4NQ65NN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentCollection = "";
let selectedMedicinesList = [];

const medicineType = document.getElementById("medicineType");
const medicineSearch = document.getElementById("medicineSearch");
const resultsDiv = document.getElementById("medicineResults");
const selectedContainer = document.getElementById("selectedMedicines");

medicineType.addEventListener("change", () => {
  currentCollection = medicineType.value === "Adult" ? "adult_medicine" : "pedia_medicine";
  selectedMedicinesList = [];
  renderSelected();
});

medicineSearch.addEventListener("input", async () => {
  resultsDiv.innerHTML = "";
  if (!medicineSearch.value || !currentCollection) return;

  const snap = await getDocs(collection(db, currentCollection));
  snap.forEach(d => {
    const data = d.data();
    if (data.name.toLowerCase().includes(medicineSearch.value.toLowerCase())) {
      const a = document.createElement("a");
      a.href="#";
      a.className="list-group-item list-group-item-action";
      a.textContent=`${data.name} - ${data.mg} (Stock:${data.qty})`;
      a.onclick=()=>addMedicine(d.id,data);
      resultsDiv.appendChild(a);
    }
  });
});

function addMedicine(id,data){
  if(selectedMedicinesList.find(m=>m.id===id)) return alert("Already added!");
  selectedMedicinesList.push({id,name:data.name,mg:data.mg,price:parseFloat(data.price),quantity:1,total:data.price});
  renderSelected();
  medicineSearch.value="";
  resultsDiv.innerHTML="";
}

function renderSelected(){
  selectedContainer.innerHTML="";
  let total=0;

  selectedMedicinesList.forEach((m,i)=>{
    total+=parseFloat(m.total);

    const div=document.createElement("div");
    div.className="border p-2 mb-2 rounded";

    div.innerHTML=`
      <strong>${m.name} - ${m.mg}</strong><br>
      Qty: <input type="number" value="${m.quantity}" min="1" style="width:60px">
      Price: <input type="number" value="${m.price}" step="0.01" style="width:80px">
      Total: ₱${m.total}
      <button class="btn btn-sm btn-danger float-end">Remove</button>
    `;

    div.querySelectorAll("input")[0].onchange=e=>{
      m.quantity=parseInt(e.target.value);
      m.total=(m.quantity*m.price).toFixed(2);
      renderSelected();
    };

    div.querySelectorAll("input")[1].onchange=e=>{
      m.price=parseFloat(e.target.value);
      m.total=(m.quantity*m.price).toFixed(2);
      renderSelected();
    };

    div.querySelector("button").onclick=()=>{
      selectedMedicinesList.splice(i,1);
      renderSelected();
    };

    selectedContainer.appendChild(div);
  });

  document.getElementById("grandTotal").textContent=total.toFixed(2);
}

document.getElementById("saveBtn").onclick=async()=>{
  if(selectedMedicinesList.length===0) return alert("Add medicine first!");

  await addDoc(collection(db,"medical_records"),{
    patientName:document.getElementById("patientName").value,
    date:document.getElementById("date").value,
    barangay:document.getElementById("barangaySelect").value,
    problem:document.getElementById("problem").value,
    blockLeader:document.getElementById("blockLeader").value,
    medicineType:medicineType.value,
    medicines:selectedMedicinesList,
    total:selectedMedicinesList.reduce((s,m)=>s+parseFloat(m.total),0)
  });

  alert("Saved!");
  selectedMedicinesList=[];
  renderSelected();
  loadHistory();
};

async function loadHistory(){
  const snap=await getDocs(collection(db,"medical_records"));
  const table=document.getElementById("history");
  table.innerHTML="";
  snap.forEach(d=>{
    const data=d.data();
    table.innerHTML+=`
      <tr>
        <td>${data.date}</td>
        <td>${data.patientName}</td>
        <td>${data.barangay}</td>
        <td>${data.problem}</td>
        <td>${data.blockLeader}</td>
        <td>${data.medicineType}</td>
        <td>${data.medicines.map(m=>m.name+" (Qty:"+m.quantity+")").join(", ")}</td>
        <td>${data.total}</td>
      </tr>
    `;
  });
}
loadHistory();

document.getElementById("exportBtn").onclick=async()=>{
  const snap=await getDocs(collection(db,"medical_records"));
  const data=[];
  snap.forEach(d=>data.push(d.data()));
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Records");
  XLSX.writeFile(wb,"Medical_Report.xlsx");
};

</script>
</body>
</html>
