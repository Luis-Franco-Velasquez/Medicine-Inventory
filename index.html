<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Medical Mission System</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  getDoc,
  query,
  where
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import * as XLSX from "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm";

const firebaseConfig = {
  apiKey: "AIzaSyDkuo0jjGYIBC1MKOWD42XvcB4nWy_72qQ",
  authDomain: "medicine-inventory-cc500.firebaseapp.com",
  databaseURL: "https://medicine-inventory-cc500-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "medicine-inventory-cc500",
  storageBucket: "medicine-inventory-cc500.firebasestorage.app",
  messagingSenderId: "1044916941588",
  appId: "1:1044916941588:web:ef2a8ee26f23b24d07c801",
  measurementId: "G-BB4NQX65NN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentCollection = "";

/* =========================
   LOAD MEDICINES
========================= */
async function loadMedicines(type) {
  currentCollection = type === "Adult"
    ? "adult_medicines"
    : "pedia_medicines";

  const dropdown = document.getElementById("medicine");
  dropdown.innerHTML = `<option value="">Select Medicine</option>`;

  const snapshot = await getDocs(collection(db, currentCollection));

  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    const option = document.createElement("option");
    option.value = docSnap.id;

    if (data.qty < 10) {
      option.textContent = `⚠ ${data.name} - ${data.mg} (LOW: ${data.qty})`;
      option.style.color = "red";
    } else {
      option.textContent = `${data.name} - ${data.mg} (Stock: ${data.qty})`;
    }

    dropdown.appendChild(option);
  });
}

/* =========================
   AUTO FILL PRICE
========================= */
document.addEventListener("change", async (e) => {
  if (e.target.id === "medicine") {
    const id = e.target.value;
    if (!id) return;

    const ref = doc(db, currentCollection, id);
    const snap = await getDoc(ref);
    const data = snap.data();

    document.getElementById("price").value = data.price;
    computeTotal();
  }
});

/* =========================
   COMPUTE TOTAL
========================= */
function computeTotal() {
  const qty = parseFloat(document.getElementById("quantity").value) || 0;
  const price = parseFloat(document.getElementById("price").value) || 0;
  document.getElementById("amount").value = (qty * price).toFixed(2);
}

window.computeTotal = computeTotal;

/* =========================
   ADD RECORD
========================= */
window.addRecord = async function() {

  const patientName = document.getElementById("patientName").value;
  const date = document.getElementById("date").value;
  const barangay = document.getElementById("barangay").value;
  const medicineId = document.getElementById("medicine").value;
  const quantity = parseInt(document.getElementById("quantity").value);
  const price = parseFloat(document.getElementById("price").value);
  const amount = parseFloat(document.getElementById("amount").value);

  if (!medicineId || !currentCollection) {
    alert("Select medicine type & medicine");
    return;
  }

  const ref = doc(db, currentCollection, medicineId);
  const snap = await getDoc(ref);
  const med = snap.data();

  if (quantity <= 0 || quantity > med.qty) {
    alert("Invalid quantity or insufficient stock!");
    return;
  }

  // Deduct stock safely
  await updateDoc(ref, {
    qty: med.qty - quantity
  });

  // Save record with price at time
  await addDoc(collection(db, "medical_records"), {
    patientName,
    date,
    barangay,
    medicineType: document.getElementById("medicineType").value,
    medicine: med.name,
    mg: med.mg,
    quantity,
    price_at_time: price,
    total: amount
  });

  alert("Record Saved!");
  loadHistory();
};

/* =========================
   LOAD PATIENT HISTORY
========================= */
async function loadHistory() {
  const snapshot = await getDocs(collection(db, "medical_records"));
  const table = document.getElementById("history");
  table.innerHTML = "";

  snapshot.forEach(docSnap => {
    const d = docSnap.data();

    table.innerHTML += `
      <tr>
        <td>${d.date}</td>
        <td>${d.patientName}</td>
        <td>${d.barangay}</td>
        <td>${d.medicineType}</td>
        <td>${d.medicine}</td>
        <td>${d.quantity}</td>
        <td>${d.total}</td>
        <td><button onclick="viewPatient('${d.patientName}')">View</button></td>
      </tr>
    `;
  });
}

window.viewPatient = async function(name) {
  const q = query(collection(db,"medical_records"),where("patientName","==",name));
  const snapshot = await getDocs(q);
  let msg = "Patient History:\n\n";
  snapshot.forEach(doc=> {
    const d = doc.data();
    msg += `${d.date} - ${d.medicine} (${d.quantity})\n`;
  });
  alert(msg);
};

/* =========================
   MONTHLY SUMMARY
========================= */
window.monthlySummary = async function() {
  const snapshot = await getDocs(collection(db,"medical_records"));
  const summary = {};

  snapshot.forEach(doc=>{
    const d = doc.data();
    const month = d.date.substring(0,7);
    if(!summary[month]) summary[month] = {};
    if(!summary[month][d.barangay]) summary[month][d.barangay] = 0;
    summary[month][d.barangay] += d.total;
  });

  console.log(summary);
  alert("Check console for summary.");
};

/* =========================
   EXPORT EXCEL
========================= */
window.exportExcel = async function() {
  const snapshot = await getDocs(collection(db,"medical_records"));
  const data = [];

  snapshot.forEach(doc=>{
    data.push(doc.data());
  });

  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Records");
  XLSX.writeFile(wb,"Medical_Report.xlsx");
};

loadHistory();
</script>

<style>
body { font-family: Arial; padding:20px; background:#f4f6f9; }
input,select,button { padding:6px; margin:5px; }
table { width:100%; border-collapse:collapse; margin-top:20px; }
th,td { border:1px solid #ccc; padding:8px; text-align:center; }
th { background:#007bff; color:white; }
</style>
</head>

<body>

<h2>Medical Mission System</h2>

<!-- PATIENT FORM -->
<div>
  <input type="text" id="patientName" placeholder="Patient Name">
  <input type="date" id="date">
  <input type="text" id="barangay" placeholder="Barangay">
  <select id="medicineType" onchange="loadMedicines(this.value)">
    <option value="">Select Type</option>
    <option>Adult</option>
    <option>Pedia</option>
  </select>
  <select id="medicine"></select>
  <input type="number" id="quantity" placeholder="Qty" oninput="computeTotal()">
  <input type="number" id="price" placeholder="Price" step="0.01" oninput="computeTotal()">
  <input type="number" id="amount" placeholder="Total" step="0.01">
  <button onclick="addRecord()">Save</button>
</div>

<!-- HISTORY -->
<h3>Patient History</h3>
<table>
<thead>
<tr>
<th>Date</th>
<th>Name</th>
<th>Barangay</th>
<th>Type</th>
<th>Medicine</th>
<th>Qty</th>
<th>Total</th>
<th>Action</th>
</tr>
</thead>
<tbody id="history"></tbody>
</table>

<br>
<button onclick="monthlySummary()">Monthly Summary</button>
<button onclick="exportExcel()">Export Excel</button>

</body>
</html>
