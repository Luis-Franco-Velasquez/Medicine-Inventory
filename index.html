<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Medical Mission System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, doc, updateDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import * as XLSX from "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm";

/* Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyDkuo0jjGYIBC1MKOWD42XvcB4nWy_72qQ",
  authDomain: "medicine-inventory-cc500.firebaseapp.com",
  projectId: "medicine-inventory-cc500",
  storageBucket: "medicine-inventory-cc500.firebasestorage.app",
  messagingSenderId: "1044916941588",
  appId: "1:1044916941588:web:ef2a8ee26f23b24d07c801",
  measurementId: "G-BB4NQ65NN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentCollection = "";
let selectedMedicinesList = [];

// Medicine Type select
document.getElementById("medicineType")?.addEventListener("change", (e)=>{
  const type = e.target.value;
  if(!type) return;
  currentCollection = type==="Adult"?"adult_medicine":"pedia_medicine";
  document.getElementById("medicineSearch").value="";
  document.getElementById("medicineResults").innerHTML="";
  selectedMedicinesList = [];
  renderSelectedMedicines();
});

// Search medicine
window.searchMedicine = async function() {
  const queryText = document.getElementById("medicineSearch").value.toLowerCase();
  const resultsDiv = document.getElementById("medicineResults");
  resultsDiv.innerHTML = "";
  if(!queryText || !currentCollection) return;

  const snapshot = await getDocs(collection(db,currentCollection));
  snapshot.forEach(docSnap=>{
    const data = docSnap.data();
    if(data.name.toLowerCase().includes(queryText)){
      const item = document.createElement("a");
      item.href="#";
      item.className="list-group-item list-group-item-action";
      item.textContent=`${data.name} - ${data.mg} (Stock: ${data.qty})`;
      item.onclick=()=>selectMedicine(docSnap.id,data);
      resultsDiv.appendChild(item);
    }
  });
};

// Select medicine and add to list
function selectMedicine(id, data) {
  if(selectedMedicinesList.find(m => m.id === id)) {
    alert("Medicine already added!");
    return;
  }

  const medEntry = {
    id,
    name: data.name,
    mg: data.mg,
    price: parseFloat(data.price),
    quantity: 1,
    total: parseFloat(data.price)
  };
  selectedMedicinesList.push(medEntry);
  renderSelectedMedicines();
  document.getElementById("medicineSearch").value = "";
  document.getElementById("medicineResults").innerHTML = "";
}

// Render selected medicines with labels
function renderSelectedMedicines() {
  const container = document.getElementById("selectedMedicines");
  container.innerHTML = "";
  let grandTotal = 0;

  selectedMedicinesList.forEach((med, index) => {
    grandTotal += parseFloat(med.total);

    const div = document.createElement("div");
    div.className = "d-flex flex-wrap align-items-center mb-1 gap-2 border p-2 rounded";
    div.innerHTML = `
      <div style="flex:2"><strong>${med.name} - ${med.mg}</strong></div>
      <div style="flex:1">
        <label>Qty:</label>
        <input type="number" value="${med.quantity}" min="1" style="width:60px;" onchange="updateMedicineQty(${index}, this.value)">
      </div>
      <div style="flex:1">
        <label>Price:</label>
        <input type="number" value="${med.price}" min="0" step="0.01" style="width:80px;" onchange="updateMedicinePrice(${index}, this.value)">
      </div>
      <div style="flex:1">
        <label>Total:</label>
        <input type="number" value="${med.total}" style="width:80px;" readonly>
      </div>
      <div style="flex:1">
        <button type="button" class="btn btn-sm btn-danger" onclick="removeMedicine(${index})">Remove</button>
      </div>
    `;
    container.appendChild(div);
  });

  document.getElementById("grandTotal").textContent = grandTotal.toFixed(2);
}

// Update quantity
function updateMedicineQty(index, qty) {
  qty = parseInt(qty);
  if(qty <= 0) return;
  selectedMedicinesList[index].quantity = qty;
  selectedMedicinesList[index].total = (qty * selectedMedicinesList[index].price).toFixed(2);
  renderSelectedMedicines();
}

// Update price
function updateMedicinePrice(index, price) {
  price = parseFloat(price);
  if(price < 0) return;
  selectedMedicinesList[index].price = price;
  selectedMedicinesList[index].total = (price * selectedMedicinesList[index].quantity).toFixed(2);
  renderSelectedMedicines();
}

// Remove medicine
function removeMedicine(index) {
  selectedMedicinesList.splice(index, 1);
  renderSelectedMedicines();
}

// Toggle barangay textbox
window.toggleBarangayTextbox = function(){
  const select=document.getElementById("barangaySelect");
  const textbox=document.getElementById("barangayTextbox");
  if(select.value==="Other"){
    textbox.style.display="block";
  } else{
    textbox.style.display="none";
    textbox.value="";
  }
};

// Add patient record
window.addRecord = async function() {
  const patientName = document.getElementById("patientName").value.trim();
  const date = document.getElementById("date").value;
  const selectedBarangay = document.getElementById("barangaySelect").value;
  const barangay = selectedBarangay==="Other"?document.getElementById("barangayTextbox").value.trim():selectedBarangay;
  const problem = document.getElementById("problem").value.trim();
  const blockLeader = document.getElementById("blockLeader").value.trim();
  const medType = document.getElementById("medicineType").value;

  if(!patientName || !date || !barangay || !problem || !blockLeader || !medType || selectedMedicinesList.length === 0){
    alert("Please fill all required fields and select at least one medicine!"); 
    return;
  }

  // Check stock for all medicines
  for(const med of selectedMedicinesList){
    const medRef = doc(db, currentCollection, med.id);
    const medSnap = await getDoc(medRef);
    const medData = medSnap.data();
    if(!medData) { alert(`Medicine ${med.name} not found!`); return; }
    if(med.quantity > medData.qty){ alert(`Not enough stock for ${med.name}!`); return; }
  }

  // Deduct stock
  for(const med of selectedMedicinesList){
    const medRef = doc(db, currentCollection, med.id);
    const medSnap = await getDoc(medRef);
    const medData = medSnap.data();
    await updateDoc(medRef, { qty: medData.qty - med.quantity });
  }

  // Save record with all medicines
  await addDoc(collection(db,"medical_records"),{
    patientName,
    date,
    barangay,
    problem,
    blockLeader,
    medicineType: medType,
    medicines: selectedMedicinesList.map(m=>({
      name: m.name,
      mg: m.mg,
      quantity: m.quantity,
      price_at_time: m.price,
      total: parseFloat(m.total)
    })),
    total: selectedMedicinesList.reduce((sum,m)=>sum + parseFloat(m.total),0)
  });

  alert("Record Saved!");
  selectedMedicinesList = [];
  renderSelectedMedicines();
  loadHistory();

  // Reset form
  document.getElementById("patientName").value="";
  document.getElementById("date").value="";
  document.getElementById("barangaySelect").value="";
  toggleBarangayTextbox();
  document.getElementById("problem").value="";
  document.getElementById("blockLeader").value="";
  document.getElementById("medicineType").value="";
};

// Load patient history with filter
window.loadHistory = async function(filterBarangay="") {
  const snapshot = await getDocs(collection(db,"medical_records"));
  const table = document.getElementById("history");
  table.innerHTML = "";
  snapshot.forEach(docSnap=>{
    const d = docSnap.data();
    if(filterBarangay && d.barangay !== filterBarangay) return;
    const meds = d.medicines.map(m=>`${m.name} (Qty:${m.quantity},₱${m.price_at_time})`).join(", ");
    table.innerHTML += `
      <tr>
        <td>${d.date}</td>
        <td>${d.patientName}</td>
        <td>${d.barangay}</td>
        <td>${d.problem}</td>
        <td>${d.blockLeader}</td>
        <td>${d.medicineType}</td>
        <td>${meds}</td>
        <td>${d.total}</td>
      </tr>`;
  });
};

// Filter by Barangay
window.filterBarangay = function() {
  const val = document.getElementById("filterBarangay").value;
  loadHistory(val);
};

// Export Excel
window.exportExcel = async function() {
  const filterVal = document.getElementById("filterBarangay").value;
  const snapshot = await getDocs(collection(db,"medical_records"));
  const data=[];
  snapshot.forEach(docSnap=>{
    const d = docSnap.data();
    if(filterVal && d.barangay !== filterVal) return;
    const record = {
      Date: d.date,
      Name: d.patientName,
      Barangay: d.barangay,
      Problem: d.problem,
      BlockLeader: d.blockLeader,
      Type: d.medicineType,
      Medicines: d.medicines.map(m=>`${m.name} (Qty:${m.quantity},₱${m.price_at_time})`).join(", "),
      Total: d.total
    };
    data.push(record);
  });
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Records");
  XLSX.writeFile(wb,"Medical_Report.xlsx");
};

loadHistory();
</script>
</head>
