<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Medical Mission System</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* Flashing LOW STOCK badge */
@keyframes flash {
  0%, 50%, 100% { opacity: 1; }
  25%, 75% { opacity: 0; }
}
.low-stock-badge {
  animation: flash 1s infinite;
  font-weight: bold;
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  getDoc,
  query,
  where
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import * as XLSX from "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm";

/* Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyDkuo0jjGYIBC1MKOWD42XvcB4nWy_72qQ",
  authDomain: "medicine-inventory-cc500.firebaseapp.com",
  projectId: "medicine-inventory-cc500",
  storageBucket: "medicine-inventory-cc500.firebasestorage.app",
  messagingSenderId: "1044916941588",
  appId: "1:1044916941588:web:ef2a8ee26f23b24d07c801",
  measurementId: "G-BB4NQX65NN"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentCollection = "";

/* Load medicines into dropdown */
async function loadMedicines(type) {
  currentCollection = type === "Adult" ? "adult_medicine" : "pedia_medicine";
  const dropdown = document.getElementById("medicine");
  dropdown.innerHTML = `<option value="">Select Medicine</option>`;
  const snapshot = await getDocs(collection(db, currentCollection));
  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    const option = document.createElement("option");
    option.value = docSnap.id;
    if (data.qty < 10) {
      option.textContent = `⚠ ${data.name} - ${data.mg} (LOW: ${data.qty})`;
      option.style.color = "red";
    } else {
      option.textContent = `${data.name} - ${data.mg} (Stock: ${data.qty})`;
    }
    dropdown.appendChild(option);
  });
}

/* Toggle barangay textbox */
function toggleBarangayTextbox() {
  const select = document.getElementById("barangaySelect");
  const textbox = document.getElementById("barangayTextbox");
  if (select.value === "Other") {
    textbox.style.display = "block";
  } else {
    textbox.style.display = "none";
    textbox.value = "";
  }
}

/* Auto-fill price on medicine select */
document.addEventListener("change", async (e) => {
  if (e.target.id === "medicine") {
    const id = e.target.value;
    if (!id) return;
    const ref = doc(db, currentCollection, id);
    const snap = await getDoc(ref);
    const data = snap.data();
    document.getElementById("price").value = data.price;
    computeTotal();
  }
});

/* Compute total */
function computeTotal() {
  const qty = parseFloat(document.getElementById("quantity").value) || 0;
  const price = parseFloat(document.getElementById("price").value) || 0;
  document.getElementById("amount").value = (qty * price).toFixed(2);
}
window.computeTotal = computeTotal;

/* Add record */
window.addRecord = async function() {
  const patientName = document.getElementById("patientName").value;
  const date = document.getElementById("date").value;
  const selectedBarangay = document.getElementById("barangaySelect").value;
  const barangay = selectedBarangay === "Other" 
    ? document.getElementById("barangayTextbox").value 
    : selectedBarangay;
  const medicineId = document.getElementById("medicine").value;
  const quantity = parseInt(document.getElementById("quantity").value);
  const price = parseFloat(document.getElementById("price").value);
  const amount = parseFloat(document.getElementById("amount").value);
  const medType = document.getElementById("medicineType").value;

  if (!patientName || !date || !barangay || !medicineId || !medType) {
    alert("Please fill all required fields!");
    return;
  }

  const ref = doc(db, currentCollection, medicineId);
  const snap = await getDoc(ref);
  const med = snap.data();

  if (quantity <= 0 || quantity > med.qty) {
    alert("Invalid quantity or insufficient stock!");
    return;
  }

  // Deduct stock
  await updateDoc(ref, { qty: med.qty - quantity });

  // Save record
  await addDoc(collection(db, "medical_records"), {
    patientName,
    date,
    barangay,
    medicineType: medType,
    medicine: med.name,
    mg: med.mg,
    quantity,
    price_at_time: price,
    total: amount
  });

  alert("Record Saved!");
  loadHistory();
};

/* Load patient history */
async function loadHistory() {
  const snapshot = await getDocs(collection(db, "medical_records"));
  const table = document.getElementById("history");
  table.innerHTML = "";
  snapshot.forEach(docSnap => {
    const d = docSnap.data();
    table.innerHTML += `
      <tr class="${d.quantity < 10 ? 'table-danger' : ''}">
        <td>${d.date}</td>
        <td>${d.patientName}</td>
        <td>${d.barangay}</td>
        <td>${d.medicineType}</td>
        <td>${d.medicine}</td>
        <td>${d.quantity}</td>
        <td>${d.total}</td>
        <td><button class="btn btn-sm btn-primary" onclick="viewPatient('${d.patientName}')">View</button></td>
      </tr>`;
  });
}
window.viewPatient = async function(name) {
  const q = query(collection(db,"medical_records"),where("patientName","==",name));
  const snapshot = await getDocs(q);
  let msg = "Patient History:\n\n";
  snapshot.forEach(doc=>{ const d = doc.data(); msg += `${d.date} - ${d.medicine} (${d.quantity})\n`; });
  alert(msg);
};

/* Monthly summary */
window.monthlySummary = async function() {
  const snapshot = await getDocs(collection(db,"medical_records"));
  const summary = {};
  snapshot.forEach(doc=>{
    const d = doc.data();
    const month = d.date.substring(0,7);
    if(!summary[month]) summary[month]={};
    if(!summary[month][d.barangay]) summary[month][d.barangay]=0;
    summary[month][d.barangay]+=d.total;
  });
  console.log(summary);
  alert("Check console for summary.");
};

/* Export Excel */
window.exportExcel = async function() {
  const snapshot = await getDocs(collection(db,"medical_records"));
  const data=[];
  snapshot.forEach(doc=>data.push(doc.data()));
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Records");
  XLSX.writeFile(wb,"Medical_Report.xlsx");
};

loadHistory();
</script>
</head>

<body class="container py-4">
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Medical Mission System</h2>
  <a href="inventory.html" class="btn btn-success">View Inventory</a>
</div>

<!-- Patient Form -->
<div class="card p-3 mb-4">
  <div class="row g-2">
    <div class="col-md-3"><input type="text" class="form-control" id="patientName" placeholder="Patient Name"></div>
    <div class="col-md-2"><input type="date" class="form-control" id="date"></div>
    <div class="col-md-2">
      <select class="form-select" id="barangaySelect" onchange="toggleBarangayTextbox()">
        <option value="">Select Barangay</option>
        <option>Aduas Centro</option>
        <option>Aduas Norte</option>
        <option>Aduas Sur</option>
        <option>Barrera</option>
        <option>Cantarilla</option>
        <option>Cruz Roja</option>
        <option>Daan Sarile</option>
        <option>Dimasalang</option>
        <option>D.S. Garcia</option>
        <option>Gen. Luna</option>
        <option>Imelda</option>
        <option>Isla</option>
        <option>M.S. Garcia</option>
        <option>Nabao</option>
        <option>Obrero</option>
        <option>Pagas</option>
        <option>Pag-Asa</option>
        <option>San Juan Acffa</option>
        <option>San Roque Norte</option>
        <option>San Roque Sur</option>
        <option>Sanbermicristi</option>
        <option>Sumacab Este</option>
        <option>Valdefuente</option>
        <option>Other</option>
      </select>
      <input type="text" class="form-control mt-1" id="barangayTextbox" placeholder="Enter Barangay" style="display:none;">
    </div>
    <div class="col-md-2">
      <select class="form-select" id="medicineType" onchange="loadMedicines(this.value)">
        <option value="">Select Type</option>
        <option>Adult</option>
        <option>Pedia</option>
      </select>
    </div>
    <div class="col-md-3">
      <select class="form-select" id="medicine"></select>
    </div>
  </div>
  <div class="row g-2 mt-2">
    <div class="col-md-1"><input type="number" class="form-control" id="quantity" placeholder="Qty" oninput="computeTotal()"></div>
    <div class="col-md-2"><input type="number" class="form-control" id="price" placeholder="Price" step="0.01" oninput="computeTotal()"></div>
    <div class="col-md-2"><input type="number" class="form-control" id="amount" placeholder="Total" step="0.01" readonly></div>
    <div class="col-md-2"><button class="btn btn-primary w-100" onclick="addRecord()">Save</button></div>
  </div>
</div>

<!-- Patient History Table -->
<div class="table-responsive">
  <table class="table table-bordered table-striped">
    <thead class="table-dark">
      <tr>
        <th>Date</th>
        <th>Name</th>
        <th>Barangay</th>
        <th>Type</th>
        <th>Medicine</th>
        <th>Qty</th>
        <th>Total</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="history"></tbody>
  </table>
</div>

<div class="mb-4">
  <button class="btn btn-info me-2" onclick="monthlySummary()">Monthly Summary</button>
  <button class="btn btn-warning" onclick="exportExcel()">Export Excel</button>
</div>
</body>
</html>
