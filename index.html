<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Mission System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .medicine-item {
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #f8f9fa;
    }

    .reminder {
      background: #fff3cd;
      color: #856404;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 10px;
    }

    #selectedMedicines {
      max-height: 250px;
      overflow-y: auto;
    }

    #medicineResults {
      z-index: 1000;
      max-height: 300px;
      overflow-y: auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Medical Mission System</h2>
    <a href="inventory.html" class="btn btn-success">View Inventory</a>
  </div>

  <div id="reminderBox"></div>
  <button class="btn btn-primary mb-3" onclick="backupDatabase()">Backup Database</button>
  <div id="backupStatus" class="text-success mb-3"></div>

  <!-- SUMMARY -->
  <div class="card p-3 mb-4">
    <h5>Total Patients per Barangay</h5>
    <ul id="summaryList" class="list-group"></ul>
  </div>

  <!-- FORM -->
  <div class="card p-3 mb-4">
    <input type="hidden" id="editId">

    <div class="row g-3 mb-3">
      <div class="col-md-2">
        <label>Date</label>
        <input type="date" class="form-control" id="date">
      </div>
      <div class="col-md-3">
        <label>Name</label>
        <input type="text" class="form-control" id="patientName">
      </div>
      <div class="col-md-3">
        <label>Barangay</label>
        <select class="form-select" id="barangaySelect">
          <option value="">Select Barangay</option>
          <option>Aduas Centro</option>
          <option>Aduas Norte</option>
          <option>Aduas Sur</option>
          <option>Barrera</option>
          <option>Cantarilla</option>
          <option>Cruz Roja</option>
          <option>Daan Sarile</option>
          <option>Dimasalang</option>
          <option>D.S. Garcia</option>
          <option>Gen. Luna</option>
          <option>Imelda</option>
          <option>Isla</option>
          <option>M.S. Garcia</option>
          <option>Nabao</option>
          <option>Obrero</option>
          <option>Pagas</option>
          <option>Pag-Asa</option>
          <option>San Juan Acffa</option>
          <option>San Roque Norte</option>
          <option>San Roque Sur</option>
          <option>Sanbermicristi</option>
          <option>Sumacab Este</option>
          <option>Valdefuente</option>
        </select>
      </div>
      <div class="col-md-2">
        <label>Block Leader</label>
        <input type="text" class="form-control" id="blockLeader">
      </div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <label>Problem</label>
        <input type="text" class="form-control" id="problem">
      </div>
      <div class="col-md-2">
        <label>Type</label>
        <select class="form-select" id="medicineType">
          <option value="">Select Type</option>
          <option>Adult</option>
          <option>Pedia</option>
        </select>
      </div>
      <div class="col-md-6 position-relative">
        <label>Search Medicine</label>
        <input type="text" class="form-control" id="medicineSearch" placeholder="Search medicine..." autocomplete="off">
        <div id="medicineResults" class="list-group position-absolute w-100"></div>
      </div>
    </div>

    <div id="selectedMedicines" class="mb-2"></div>
    <div class="text-end mb-3">
      <strong>Total: ₱<span id="grandTotal">0.00</span></strong>
    </div>

    <div class="text-end">
      <button class="btn btn-primary me-2" id="saveBtn">Save</button>
      <button class="btn btn-secondary" id="cancelEditBtn" style="display:none;">Cancel Edit</button>
    </div>

  </div>

  <!-- FILTER -->
  <div class="mb-3">
    <label>Filter by Barangay</label>
    <select class="form-select w-25" id="filterBarangay">
      <option value="">All</option>
      <option>Aduas Centro</option>
      <option>Aduas Norte</option>
      <option>Aduas Sur</option>
      <option>Barrera</option>
      <option>Cantarilla</option>
      <option>Cruz Roja</option>
      <option>Daan Sarile</option>
      <option>Dimasalang</option>
      <option>D.S. Garcia</option>
      <option>Gen. Luna</option>
      <option>Imelda</option>
      <option>Isla</option>
      <option>M.S. Garcia</option>
      <option>Nabao</option>
      <option>Obrero</option>
      <option>Pagas</option>
      <option>Pag-Asa</option>
      <option>San Juan Acffa</option>
      <option>San Roque Norte</option>
      <option>San Roque Sur</option>
      <option>Sanbermicristi</option>
      <option>Sumacab Este</option>
      <option>Valdefuente</option>
    </select>
    <button class="btn btn-warning mt-2" id="exportBtn">Export Filtered</button>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Date</th>
          <th>Name</th>
          <th>Barangay</th>
          <th>BlockLeader</th>
          <th>Type</th>
          <th>Problem</th>
          <th>Medicines</th>
          <th>Total</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="history"></tbody>
    </table>
  </div>

  <script type="module">

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDkuo0jjGYIBC1MKOWD42XvcB4nWy_72qQ",
      authDomain: "medicine-inventory-cc500.firebaseapp.com",
      projectId: "medicine-inventory-cc500",
      storageBucket: "medicine-inventory-cc500.appspot.com",
      messagingSenderId: "1044916941588",
      appId: "1:1044916941588:web:ef2a8ee26f23b24d07c801"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, addDoc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let selectedMedicinesList = [];
    let currentCollection = "";
    const historyTable = document.getElementById("history");
    const summaryList = document.getElementById("summaryList");
    const medicineType = document.getElementById("medicineType");
    const medicineSearch = document.getElementById("medicineSearch");
    const medicineResults = document.getElementById("medicineResults");

    medicineType.addEventListener("change", () => {
      currentCollection = medicineType.value === "Adult" ? "adult_medicine" : "pedia_medicine";
      selectedMedicinesList = [];
      renderSelectedMedicines();
      medicineSearch.value = "";
      medicineResults.innerHTML = "";
    });

    // ============================================
    // MEDICINE SEARCH FUNCTIONALITY
    // ============================================

    medicineSearch.addEventListener("input", async (e) => {
      const searchTerm = e.target.value.trim().toLowerCase();
      
      if (!searchTerm || !currentCollection) {
        medicineResults.innerHTML = "";
        if (!currentCollection && searchTerm) {
          medicineResults.innerHTML = `
            <div class="list-group-item text-warning">Please select Adult or Pedia type first</div>
          `;
        }
        return;
      }

      try {
        const snapshot = await getDocs(collection(db, currentCollection));
        medicineResults.innerHTML = "";
        
        let foundCount = 0;
        
        snapshot.forEach((docSnap) => {
          const med = docSnap.data();
          const medName = (med.name || "").toLowerCase();
          const medMg = (med.mg || "").toString().toLowerCase();
          
          if (medName.includes(searchTerm) || medMg.includes(searchTerm)) {
            foundCount++;
            
            const item = document.createElement("button");
            item.className = "list-group-item list-group-item-action";
            item.type = "button";
            item.innerHTML = `
              <div class="d-flex justify-content-between">
                <strong>${med.name} ${med.mg ? '- ' + med.mg : ''}</strong>
                <span class="text-muted">₱${med.price || 0}</span>
              </div>
              <small class="text-muted">Stock: ${med.quantity || 0}</small>
            `;
            
            item.addEventListener("click", () => {
              addMedicineToSelection({
                id: docSnap.id,
                name: med.name,
                mg: med.mg || "",
                price: parseFloat(med.price) || 0,
                quantity: 1,
                total: parseFloat(med.price) || 0
              });
              medicineSearch.value = "";
              medicineResults.innerHTML = "";
            });
            
            medicineResults.appendChild(item);
          }
        });
        
        if (foundCount === 0) {
          medicineResults.innerHTML = `
            <div class="list-group-item text-muted">No medicines found</div>
          `;
        }
        
      } catch (error) {
        console.error("Error searching medicines:", error);
        medicineResults.innerHTML = `
          <div class="list-group-item text-danger">Error loading medicines</div>
        `;
      }
    });

    function addMedicineToSelection(medicine) {
      const existingIndex = selectedMedicinesList.findIndex(m => m.id === medicine.id);
      
      if (existingIndex >= 0) {
        selectedMedicinesList[existingIndex].quantity += 1;
        selectedMedicinesList[existingIndex].total = 
          selectedMedicinesList[existingIndex].quantity * 
          selectedMedicinesList[existingIndex].price;
      } else {
        selectedMedicinesList.push(medicine);
      }
      
      renderSelectedMedicines();
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest("#medicineSearch") && !e.target.closest("#medicineResults")) {
        medicineResults.innerHTML = "";
      }
    });

    // ============================================
    // RENDER FUNCTIONS
    // ============================================

    function renderSelectedMedicines() {
      const container = document.getElementById("selectedMedicines");
      container.innerHTML = "";
      let total = 0;

      selectedMedicinesList.forEach((med, index) => {
        total += med.total;

        container.innerHTML += `
          <div class="medicine-item">
            <div class="row">
              <div class="col-12 mb-2">
                <strong>${med.name} - ${med.mg}</strong>
              </div>
              <div class="col-md-3 col-6">
                <label class="small">Qty</label>
                <input type="number" class="form-control form-control-sm"
                  value="${med.quantity}"
                  onchange="updateQty(${index},this.value)">
              </div>
              <div class="col-md-3 col-6">
                <label class="small">Price</label>
                <input type="number" class="form-control form-control-sm"
                  value="${med.price}"
                  onchange="updatePrice(${index},this.value)">
              </div>
              <div class="col-md-3 col-6">
                <label class="small">Total</label>
                <input type="number" class="form-control form-control-sm"
                  value="${med.total}" readonly>
              </div>
              <div class="col-md-3 col-6 d-flex align-items-end">
                <button class="btn btn-danger btn-sm w-100"
                  onclick="removeMedicine(${index})">Remove</button>
              </div>
            </div>
          </div>
        `;
      });

      document.getElementById("grandTotal").textContent = total.toFixed(2);
    }

    window.updateQty = (i, val) => {
      val = parseInt(val) || 1;
      if (val < 1) val = 1;
      selectedMedicinesList[i].quantity = val;
      selectedMedicinesList[i].total = val * selectedMedicinesList[i].price;
      renderSelectedMedicines();
    };

    window.updatePrice = (i, val) => {
      val = parseFloat(val) || 0;
      selectedMedicinesList[i].price = val;
      selectedMedicinesList[i].total = val * selectedMedicinesList[i].quantity;
      renderSelectedMedicines();
    };

    window.removeMedicine = (i) => {
      selectedMedicinesList.splice(i, 1);
      renderSelectedMedicines();
    };

    // ============================================
    // LOAD HISTORY
    // ============================================

    async function loadHistory() {
      const snapshot = await getDocs(collection(db, "medical_records"));
      historyTable.innerHTML = "";
      const counts = {};

      snapshot.forEach(docSnap => {
        const d = docSnap.data();
        counts[d.barangay] = (counts[d.barangay] || 0) + 1;

        const meds = d.medicines.map(m => `${m.name} (Qty:${m.quantity})`).join(", ");

        historyTable.innerHTML += `
          <tr>
            <td>${d.date}</td>
            <td>${d.patientName}</td>
            <td>${d.barangay}</td>
            <td>${d.blockLeader}</td>
            <td>${d.medicineType}</td>
            <td>${d.problem}</td>
            <td>${meds}</td>
            <td>₱${d.total}</td>
            <td>
              <button class="btn btn-warning btn-sm editBtn" data-id="${docSnap.id}">Edit</button>
              <button class="btn btn-danger btn-sm deleteBtn" data-id="${docSnap.id}">Delete</button>
            </td>
          </tr>
        `;
      });

      summaryList.innerHTML = "";
      for (const b in counts) {
        summaryList.innerHTML += `
          <li class="list-group-item d-flex justify-content-between">
            ${b}
            <span class="badge bg-primary">${counts[b]}</span>
          </li>
        `;
      }
    }

    loadHistory();

    // ============================================
    // EVENT DELEGATION (Edit/Delete)
    // ============================================

    historyTable.addEventListener("click", async (e) => {
      if (e.target && e.target.matches(".editBtn")) {
        const recordId = e.target.getAttribute("data-id");
        const docRef = doc(db, "medical_records", recordId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();

          document.getElementById("editId").value = docSnap.id;
          document.getElementById("date").value = data.date;
          document.getElementById("patientName").value = data.patientName;
          document.getElementById("barangaySelect").value = data.barangay;
          document.getElementById("blockLeader").value = data.blockLeader;
          document.getElementById("problem").value = data.problem;
          document.getElementById("medicineType").value = data.medicineType;
          
          currentCollection = data.medicineType === "Adult" ? "adult_medicine" : "pedia_medicine";

          selectedMedicinesList = data.medicines || [];
          renderSelectedMedicines();

          document.getElementById("cancelEditBtn").style.display = "inline";
          document.getElementById("saveBtn").textContent = "Update";
        }
      }

      if (e.target && e.target.matches(".deleteBtn")) {
        if (confirm("Are you sure you want to delete this record?")) {
          const recordId = e.target.getAttribute("data-id");
          const docRef = doc(db, "medical_records", recordId);
          await deleteDoc(docRef);
          loadHistory();
        }
      }
    });

    // ============================================
    // SAVE / UPDATE FUNCTIONALITY
    // ============================================

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const id = document.getElementById("editId").value;
      const date = document.getElementById("date").value;
      const patientName = document.getElementById("patientName").value;
      const barangay = document.getElementById("barangaySelect").value;
      const blockLeader = document.getElementById("blockLeader").value;
      const problem = document.getElementById("problem").value;
      const medType = document.getElementById("medicineType").value;

      if (!date || !patientName || !barangay || !medType) {
        alert("Please fill in required fields: Date, Name, Barangay, and Type");
        return;
      }

      const recordData = {
        date,
        patientName,
        barangay,
        blockLeader,
        problem,
        medicineType: medType,
        medicines: selectedMedicinesList,
        total: selectedMedicinesList.reduce((acc, med) => acc + med.total, 0).toFixed(2)
      };

      try {
        if (id) {
          const docRef = doc(db, "medical_records", id);
          await updateDoc(docRef, recordData);
        } else {
          await addDoc(collection(db, "medical_records"), recordData);
        }
        
        resetForm();
        loadHistory();
      } catch (error) {
        console.error("Error saving record:", error);
        alert("Error saving record. Please try again.");
      }
    });

    document.getElementById("cancelEditBtn").addEventListener("click", resetForm);

    function resetForm() {
      document.getElementById("editId").value = "";
      document.getElementById("date").value = "";
      document.getElementById("patientName").value = "";
      document.getElementById("barangaySelect").value = "";
      document.getElementById("blockLeader").value = "";
      document.getElementById("problem").value = "";
      document.getElementById("medicineType").value = "";
      medicineSearch.value = "";
      medicineResults.innerHTML = "";
      selectedMedicinesList = [];
      currentCollection = "";
      renderSelectedMedicines();

      document.getElementById("cancelEditBtn").style.display = "none";
      document.getElementById("saveBtn").textContent = "Save";
    }

    // ============================================
    // FILTER FUNCTIONALITY
    // ============================================

    document.getElementById("filterBarangay").addEventListener("change", async (e) => {
      const filterValue = e.target.value;
      const snapshot = await getDocs(collection(db, "medical_records"));
      historyTable.innerHTML = "";
      
      snapshot.forEach(docSnap => {
        const d = docSnap.data();
        if (!filterValue || d.barangay === filterValue) {
          const meds = d.medicines.map(m => `${m.name} (Qty:${m.quantity})`).join(", ");
          historyTable.innerHTML += `
            <tr>
              <td>${d.date}</td>
              <td>${d.patientName}</td>
              <td>${d.barangay}</td>
              <td>${d.blockLeader}</td>
              <td>${d.medicineType}</td>
              <td>${d.problem}</td>
              <td>${meds}</td>
              <td>₱${d.total}</td>
              <td>
                <button class="btn btn-warning btn-sm editBtn" data-id="${docSnap.id}">Edit</button>
                <button class="btn btn-danger btn-sm deleteBtn" data-id="${docSnap.id}">Delete</button>
              </td>
            </tr>
          `;
        }
      });
    });

    // ============================================
    // EXPORT FUNCTIONALITY
    // ============================================

    document.getElementById("exportBtn").addEventListener("click", async () => {
      const filterValue = document.getElementById("filterBarangay").value;
      const snapshot = await getDocs(collection(db, "medical_records"));
      let csvContent = "Date,Name,Barangay,Block Leader,Type,Problem,Medicines,Total\n";
      
      snapshot.forEach(docSnap => {
        const d = docSnap.data();
        if (!filterValue || d.barangay === filterValue) {
          const meds = d.medicines.map(m => `${m.name}(Qty:${m.quantity})`).join("; ");
          csvContent += `"${d.date}","${d.patientName}","${d.barangay}","${d.blockLeader}","${d.medicineType}","${d.problem}","${meds}","${d.total}"\n`;
        }
      });
      
      const blob = new Blob([csvContent], { type: "text/csv" });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.setAttribute("hidden", "");
      a.setAttribute("href", url);
      a.setAttribute("download", `medical_records_${filterValue || "all"}.csv`);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    // ============================================
    // BACKUP FUNCTION (Placeholder)
    // ============================================

    window.backupDatabase = async () => {
      const status = document.getElementById("backupStatus");
      status.textContent = "Creating backup...";
      
      try {
        const recordsSnapshot = await getDocs(collection(db, "medical_records"));
        const adultSnapshot = await getDocs(collection(db, "adult_medicine"));
        const pediaSnapshot = await getDocs(collection(db, "pedia_medicine"));
        
        const backup = {
          timestamp: new Date().toISOString(),
          medical_records: [],
          adult_medicine: [],
          pedia_medicine: []
        };
        
        recordsSnapshot.forEach(doc => backup.medical_records.push({ id: doc.id, ...doc.data() }));
        adultSnapshot.forEach(doc => backup.adult_medicine.push({ id: doc.id, ...doc.data() }));
        pediaSnapshot.forEach(doc => backup.pedia_medicine.push({ id: doc.id, ...doc.data() }));
        
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.setAttribute("hidden", "");
        a.setAttribute("href", url);
        a.setAttribute("download", `backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        status.textContent = "Backup downloaded successfully!";
        setTimeout(() => status.textContent = "", 3000);
      } catch (error) {
        console.error("Backup error:", error);
        status.textContent = "Backup failed!";
        status.className = "text-danger mb-3";
      }
    };

  </script>

</body>
</html>
